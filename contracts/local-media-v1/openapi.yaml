openapi: 3.1.0
info:
  title: OpenClaw local media service
  version: 1.0.0
  description: >-
    Content-bearing STT and TTS operations plus content-free lifecycle probes.
    Implementations must bind to loopback unless an authenticated transport is
    added by a later contract version.
servers:
  - url: http://127.0.0.1:8000
paths:
  /v1/capabilities:
    get:
      operationId: getSpeechCapabilities
      responses:
        "200":
          description: Versioned, content-free backend capability metadata.
          headers:
            X-OpenClaw-Service-Generation:
              $ref: "#/components/headers/ServiceGeneration"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schema_version, model, generation, expression]
                properties:
                  schema_version:
                    const: 1
                  model:
                    type: string
                    maxLength: 128
                  generation:
                    $ref: "#/components/schemas/ServiceGeneration"
                  expression:
                    oneOf:
                      - type: "null"
                      - type: object
                        additionalProperties: false
                        required: [emotions, vocalEvents, emphasis, whisper]
                        properties:
                          emotions:
                            type: array
                            maxItems: 32
                            items: { type: string, maxLength: 32 }
                          vocalEvents:
                            type: array
                            maxItems: 32
                            items: { type: string, maxLength: 32 }
                          emphasis: { type: boolean }
                          whisper: { type: boolean }
                  segmentation:
                    type: object
                    additionalProperties: false
                    required: [schema_version, profile, prepared_segments]
                    properties:
                      schema_version: { const: 1 }
                      prepared_segments: { const: true }
                      profile:
                        $ref: "#/components/schemas/SpeechSegmentationProfile"
  /live:
    get:
      operationId: getLiveness
      responses:
        "200":
          description: The process event loop is responsive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: The requested model and compute backend are ready.
          headers:
            X-OpenClaw-Service-Generation:
              $ref: "#/components/headers/ServiceGeneration"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: The service is live but not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /status:
    get:
      operationId: getStatus
      responses:
        "200":
          description: Content-free lifecycle state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatus"
  /v1/audio/transcriptions:
    post:
      operationId: transcribeAudio
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestTimeout"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, model]
              properties:
                file:
                  type: string
                  format: binary
                  maxLength: 20971520
                model:
                  type: string
                  minLength: 1
                  maxLength: 128
                language:
                  type: string
                  minLength: 1
                  maxLength: 35
                prompt:
                  type: string
                  maxLength: 4096
                stream:
                  type: boolean
                  default: false
                  description: >-
                    Multipart value must be the literal true or false. True
                    selects the optional SSE response; omitted/false preserves JSON.
      responses:
        "200":
          description: Successful transcription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
            text/event-stream:
              schema:
                type: string
              description: >-
                UTF-8 SSE with data-only JSON records described by
                TranscriptionStreamEvent. At most one speech.confirmed event
                precedes exactly one transcript.done or error terminal event,
                then EOF. No confirmation is emitted with disabled VAD or
                zero/nonfinite retained audio. Disconnect may terminate before
                a terminal event; clients must not interpret that as success.
              x-event-schema:
                $ref: "#/components/schemas/TranscriptionStreamEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/TooLarge"
        "408":
          $ref: "#/components/responses/Expired"
        "409":
          $ref: "#/components/responses/Cancelled"
        "429":
          $ref: "#/components/responses/Overloaded"
        "500":
          description: Inference failed before a JSON response or stream was opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/audio/speech:
    post:
      operationId: synthesizeSpeech
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestTimeout"
        - $ref: "#/components/parameters/ServiceGeneration"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeechRequest"
      responses:
        "200":
          description: Encoded speech audio.
          headers:
            X-OpenClaw-Service-Generation:
              $ref: "#/components/headers/ServiceGeneration"
          content:
            audio/ogg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/TooLarge"
        "408":
          $ref: "#/components/responses/Expired"
        "409":
          $ref: "#/components/responses/Cancelled"
        "429":
          $ref: "#/components/responses/Overloaded"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/audio/speech/stream:
    post:
      operationId: streamSpeech
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestTimeout"
        - $ref: "#/components/parameters/ServiceGeneration"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeechRequest"
      responses:
        "200":
          description: >-
            PCM-only stream. Each record is a big-endian uint32 byte length plus
            that many PCM16 mono bytes. Zero length is successful completion;
            EOF without it is failure/cancellation. Native sample rate is returned
            in X-OpenClaw-Audio-Sample-Rate.
          headers:
            X-OpenClaw-Service-Generation:
              $ref: "#/components/headers/ServiceGeneration"
          content:
            application/vnd.openclaw.pcm-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "408":
          $ref: "#/components/responses/Expired"
        "409":
          $ref: "#/components/responses/Cancelled"
        "429":
          $ref: "#/components/responses/Overloaded"
  /v1/requests/{requestId}/cancel:
    post:
      operationId: cancelRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The random UUIDv4 of the request in this service process.
      responses:
        "204":
          description: Cancellation registered, including pre-arrival cancellation.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/Overloaded"
  /v1/voices:
    get:
      operationId: listSpeechVoices
      responses:
        "200":
          description: Public voice metadata without reference paths or generation settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceList"
components:
  headers:
    ServiceGeneration:
      description: Opaque identity of the warmed worker, never a persistent supervisor PID.
      schema:
        $ref: "#/components/schemas/ServiceGeneration"
  parameters:
    ServiceGeneration:
      name: X-OpenClaw-Service-Generation
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/ServiceGeneration"
      description: Mandatory when expression or segmentation is supplied; stale or missing admission fails with generation_conflict.
    RequestId:
      name: X-OpenClaw-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Fresh random UUIDv4, never an identity or reused request ID.
    RequestTimeout:
      name: X-OpenClaw-Request-Timeout-Ms
      in: header
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 300000
      description: Monotonic request budget including queue and preparation time.
  schemas:
    ServiceGeneration:
      type: string
      pattern: "^[A-Za-z0-9._-]{1,128}$"
    Liveness:
      type: object
      additionalProperties: false
      required: [live]
      properties:
        live:
          const: true
    Readiness:
      type: object
      additionalProperties: false
      required: [ready, state]
      properties:
        ready:
          type: boolean
        state:
          enum: [starting, loading, ready, busy, warm, cooling, standby, fault]
        model:
          type: string
          maxLength: 128
        generation:
          $ref: "#/components/schemas/ServiceGeneration"
        requestedBackend:
          enum: [cuda, cpu]
        observedBackend:
          enum: [cuda, cpu, unavailable, unknown]
        acceleratorLease:
          enum: [disabled, valid, unavailable, expired]
    ServiceStatus:
      type: object
      additionalProperties: false
      required: [ready, state, activeRequests, queueDepth]
      properties:
        ready:
          type: boolean
        state:
          enum: [starting, loading, ready, busy, warm, cooling, standby, fault]
        model:
          type: string
          maxLength: 128
        generation:
          $ref: "#/components/schemas/ServiceGeneration"
        requestedBackend:
          enum: [cuda, cpu]
        observedBackend:
          enum: [cuda, cpu, unavailable, unknown]
        acceleratorLease:
          enum: [disabled, valid, unavailable, expired]
        activeRequests:
          type: integer
          minimum: 0
        queueDepth:
          type: integer
          minimum: 0
    Transcription:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
        model:
          type: string
          maxLength: 128
    TranscriptionStreamEvent:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              const: speech.confirmed
        - type: object
          additionalProperties: false
          required: [type, text, model]
          properties:
            type:
              const: transcript.done
            text:
              type: string
            model:
              type: string
              maxLength: 128
            recognition:
              $ref: "#/components/schemas/RecognitionEvidence"
        - type: object
          additionalProperties: false
          required: [type, error]
          properties:
            type:
              const: error
            error:
              type: object
              additionalProperties: false
              required: [code, message, retryable]
              properties:
                code:
                  enum:
                    [
                      inference_failed,
                      cancelled,
                      deadline_exceeded,
                      payload_too_large,
                      invalid_request,
                    ]
                message:
                  type: string
                  maxLength: 512
                retryable:
                  type: boolean
    RecognitionEvidence:
      type: object
      additionalProperties: false
      required: [audioDurationMs, speechDurationMs, segmentCount, signals]
      description: >-
        Optional recognition observations, not calibrated confidence and not
        instructions to change input gain. Missing backend data is null or omitted
        from signals; no media, transcript, or caller identity is included.
      properties:
        audioDurationMs:
          type: [integer, "null"]
          minimum: 0
        speechDurationMs:
          type: [integer, "null"]
          minimum: 0
        segmentCount:
          type: integer
          minimum: 0
          maximum: 2147483647
        signals:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [name, mean, samples]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 64
                description: Backend-scoped metric name with backend-defined semantics.
              mean:
                type: number
                description: Finite arithmetic mean of accepted segment observations.
              samples:
                type: integer
                minimum: 1
                maximum: 2147483647
    SpeechRequest:
      type: object
      additionalProperties: false
      required: [input, model, voice, response_format]
      properties:
        input:
          type: string
          minLength: 1
          maxLength: 4096
        model:
          type: string
          minLength: 1
          maxLength: 128
        voice:
          type: string
          minLength: 1
          maxLength: 128
        response_format:
          enum: [opus, wav, pcm]
        sample_rate:
          type: integer
          enum: [8000, 16000, 24000, 48000]
        expression:
          $ref: "#/components/schemas/SpeechExpression"
        segmentation:
          $ref: "#/components/schemas/SpeechSegmentation"
    SpeechSegmentationProfile:
      type: object
      additionalProperties: false
      required: [minChars, targetWords, maxWords, maxChars, pauses]
      description: >-
        Immutable backend packing preferences and hard limits. minChars must
        not exceed maxChars and targetWords must not exceed maxWords. Short
        complete inputs are allowed. Word budgets count Unicode letter/number/
        underscore groups; minChars is a packing preference, not a filter.
      properties:
        minChars: { type: integer, minimum: 0, maximum: 2000 }
        targetWords: { type: integer, minimum: 1, maximum: 200 }
        maxWords: { type: integer, minimum: 1, maximum: 200 }
        maxChars: { type: integer, minimum: 64, maximum: 2000 }
        pauses:
          type: object
          additionalProperties: false
          required: [paragraph, sentence, clause, fragment]
          properties:
            paragraph: { type: integer, minimum: 0, maximum: 2000 }
            sentence: { type: integer, minimum: 0, maximum: 2000 }
            clause: { type: integer, minimum: 0, maximum: 2000 }
            fragment: { type: integer, minimum: 0, maximum: 2000 }
    SpeechSegmentation:
      type: object
      additionalProperties: false
      required: [schema_version, segments]
      description: >-
        An ordered native synthesis plan. Trimmed segment texts must be exact
        contiguous slices covering input in order, excluding only boundary
        whitespace; no words, controls or non-whitespace may be lost. Units
        must fit the admitted profile's hard limits and not split words or
        expression emphasis spans. pauseMs is zero or an admitted profile
        pause. The worker validates and renders without re-segmentation.
      properties:
        schema_version: { const: 1 }
        segments:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [text, pauseMs]
            properties:
              text: { type: string, minLength: 1, maxLength: 2000 }
              pauseMs: { type: integer, minimum: 0, maximum: 2000 }
    SpeechExpression:
      type: object
      additionalProperties: false
      required: [parts]
      description: >-
        Optional speech-only direction. The concatenation of all text parts
        must equal the trimmed input exactly. No backend/native tags in input
        or text parts. Unsupported controls/backend fail before inference.
        The caller owns channel opt-in and the unmodified visible-text projection.
        Top-level emotion initializes the active emotion. A text-part emotion
        changes it from that part onward until the next explicit change.
      properties:
        emotion:
          type: string
          minLength: 1
          maxLength: 32
        parts:
          type: array
          minItems: 1
          maxItems: 128
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [text]
                properties:
                  text: { type: string, minLength: 1, maxLength: 4096 }
                  emotion: { type: string, minLength: 1, maxLength: 32 }
                  emphasis: { type: boolean }
              - type: object
                additionalProperties: false
                required: [event]
                properties:
                  event: { type: string, minLength: 1, maxLength: 32 }
    VoiceList:
      type: object
      additionalProperties: false
      required: [object, model, default_voice, data]
      properties:
        object:
          const: list
        model:
          type: string
          minLength: 1
          maxLength: 128
        default_voice:
          type: string
          minLength: 1
          maxLength: 64
        data:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/Voice"
    Voice:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
        name:
          type: string
          minLength: 1
          maxLength: 128
        locale:
          type: string
          minLength: 1
          maxLength: 32
        description:
          type: string
          minLength: 1
          maxLength: 512
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code:
              enum:
                - invalid_request
                - unsupported_media
                - payload_too_large
                - overloaded
                - timeout
                - deadline_exceeded
                - cancelled
                - generation_conflict
                - accelerator_unavailable
                - model_unavailable
                - inference_failed
            message:
              type: string
              maxLength: 512
            retryable:
              type: boolean
  responses:
    Expired:
      description: The bounded request deadline expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Cancelled:
      description: Request cancelled, identifier already in use/retired, or admitted speech worker generation changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid or unsupported request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: Bounded input or output limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Overloaded:
      description: The bounded queue is full.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Model or accelerator is not ready.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
