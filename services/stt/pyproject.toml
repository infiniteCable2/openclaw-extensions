[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-local-stt"
version = "0.1.0"
description = "Fail-closed CUDA Faster-Whisper service for OpenClaw"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Flask==3.1.3",
  "waitress==3.0.2",
]

[project.optional-dependencies]
cuda = [
  "faster-whisper==1.2.1",
  "nvidia-cublas-cu12==12.4.5.8",
  "nvidia-cudnn-cu12==9.1.0.70",
]
test = ["pytest==8.4.2"]

[project.scripts]
openclaw-local-stt = "openclaw_local_stt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
