[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "openclaw-accelerator-runner"
version = "0.1.0"
description = "Fail-closed accelerator lease supervisor for OpenClaw local workers"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
openclaw-accelerator-run = "openclaw_accelerator.cli:main"
openclaw-accelerator-broker = "openclaw_accelerator.broker:main"
openclaw-accelerator-cuda-probe = "openclaw_accelerator.cuda_driver_probe:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openclaw_accelerator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
