[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-local-tts"
version = "0.1.0"
description = "Fail-closed CUDA Chatterbox speech service for OpenClaw"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Flask==3.1.3",
  "numpy==2.4.6",
  "waitress==3.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
openclaw-local-tts = "openclaw_local_tts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
